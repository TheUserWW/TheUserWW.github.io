<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TheUserWW - Competitive Programming Notes</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Personal competitive programming notes, algorithms, and coding templates.">
  
  <!-- Docsify Vue Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  
  <style>
    :root {
      --primary-color: #2c3e50;
      --text-color: #34495e;
      --border-color: #ecf0f1;
      --link-color: #3498db;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  
  <script>
    window.$docsify = {
      name: 'TheUserWW CP Notes',
      nameLink: '/',
      repo: 'https://github.com/TheUserWW/TheUserWW.github.io',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      maxLevel: 4,
      
      // Search Configuration (English)
      search: {
        placeholder: 'Search topics or algorithms...',
        noData: 'No results found',
        depth: 4,
        hideOtherSidebarContent: false
      },
      
      // Code Copy Button (English)
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },
      
      // Footer
      footer: {
        copy: '<span>© 2026 TheUserWW | <a href="https://github.com/TheUserWW" target="_blank">GitHub</a></span>',
        auth: '',
        pre: '<hr/>',
        style: 'text-align: center; padding: 20px;'
      }
    }
  </script>

  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Full Text Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Code Copy Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- C++ Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <!-- LaTeX Math Formula Rendering -->
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@1.4.5/dist/docsify-katex.js"></script>
  <!-- Footer Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-footer-enh/dist/docsify-footer-enh.min.js"></script>
</body>
</html>
