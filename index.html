<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TheUserWW - Competitive Programming Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal competitive programming notes, algorithms, and coding templates.">
  <meta name="keywords" content="competitive programming, algorithms, C++, data structures, codeforces">
  <meta name="author" content="TheUserWW">
  <meta property="og:title" content="TheUserWW - Competitive Programming Notes">
  <meta property="og:description" content="Personal competitive programming notes, algorithms, and coding templates.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#2574a9">
  <link rel="icon" type="image/jpeg" href="TentMap.jpg">

  <!-- Apply saved/system theme before first paint (prevents a light flash in dark mode) -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ===== Theme tokens: every colour lives here, no !important needed ===== */
    :root {
      --theme-color: #2574a9;
      --accent: #2574a9;
      --bg: #ffffff;
      --bg-alt: #f6f8fa;
      --text: #2c3e50;
      --muted: #5c6b7a;
      --border: #e3e8ee;
      --inline-bg: #f3f4f6;
      --inline-fg: #c2255c;
      --code-bg: #1e1f29;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --theme-color: #58a6ff;
      --accent: #58a6ff;
      --bg: #0d1117;
      --bg-alt: #161b22;
      --text: #e2e8f0;
      --muted: #8b949e;
      --border: #30363d;
      --inline-bg: #1c2230;
      --inline-fg: #79c0ff;
      --code-bg: #010409;
      color-scheme: dark;
    }

    body, .sidebar, .content, .markdown-section, .search input, .sidebar-toggle {
      transition: background-color .25s ease, color .25s ease, border-color .25s ease;
    }
    body { background: var(--bg); color: var(--text); }
    .content { background: var(--bg); }
    .markdown-section { color: var(--text); max-width: 880px; }

    /* ===== Typography ===== */
    .markdown-section h1 { border-bottom: 3px solid var(--accent); padding-bottom: .4em; }
    .markdown-section h2 { border-left: 4px solid var(--accent); padding-left: 12px; border-bottom: 0; }
    .markdown-section h1, .markdown-section h2, .markdown-section h4,
    .markdown-section h5, .markdown-section h6 { color: var(--text); }
    .markdown-section h3 { color: var(--accent); }
    .markdown-section p, .markdown-section li { color: var(--text); line-height: 1.8; }
    .markdown-section strong { color: var(--text); font-weight: 650; }
    .markdown-section a { color: var(--accent); border-bottom: 1px solid transparent; transition: border-color .2s; }
    .markdown-section a:hover { border-bottom-color: var(--accent); }
    .markdown-section hr { border-bottom-color: var(--border); }
    .markdown-section blockquote {
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border-left: 4px solid var(--accent);
      color: var(--text);
      border-radius: 0 6px 6px 0;
    }

    /* ===== Code ===== */
    .markdown-section pre {
      background: var(--code-bg);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
    }
    .markdown-section pre > code { background: transparent; color: #f8f8f2; font-size: .92em; }
    .markdown-section code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .markdown-section :not(pre) > code {
      background: var(--inline-bg);
      color: var(--inline-fg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .15em .45em;
    }
    .docsify-copy-code-button { border-radius: 4px; }

    /* ===== Tables ===== */
    .markdown-section table { border-collapse: collapse; }
    .markdown-section th { background: var(--accent); color: #fff; border-color: var(--accent); }
    .markdown-section td { border-color: var(--border); color: var(--text); }
    .markdown-section tr { background: var(--bg); border-top-color: var(--border); }
    .markdown-section tr:nth-child(2n) { background: var(--bg-alt); }
    .markdown-section tr:hover { background: color-mix(in srgb, var(--accent) 8%, var(--bg)); }

    /* ===== Sidebar & search ===== */
    .sidebar { background: var(--bg-alt); border-right: 1px solid var(--border); color: var(--text); }
    .sidebar .app-name-link, .sidebar-nav { color: var(--text); }
    .sidebar ul li a { color: var(--muted); border-radius: 6px; transition: background-color .2s, color .2s; }
    .sidebar ul li a:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); text-decoration: none; }
    .sidebar ul li.active > a { color: var(--accent); font-weight: 600; border-right: 0; background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .sidebar-toggle { background-color: var(--bg-alt); }
    .sidebar-toggle span { background-color: var(--accent); }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .sidebar .search { border-bottom-color: var(--border); }
    .sidebar .search input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; }
    .sidebar .search input:focus { border-color: var(--accent); outline: 0; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    .sidebar .search .matching-post { border-bottom-color: var(--border); }
    .sidebar .search .search-keyword { color: #d97706; font-style: normal; font-weight: 600; }

    /* ===== Footer ===== */
    footer, .footer { color: var(--muted); border-top: 1px solid var(--border); }
    footer a, .footer a { color: var(--accent); }

    /* ===== Floating buttons ===== */
    .fab-group { position: fixed; right: 20px; bottom: 20px; display: flex; gap: 10px; z-index: 1000; }
    .fab {
      width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
      background: var(--accent); color: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
      transition: transform .2s ease, opacity .2s ease, box-shadow .2s ease;
    }
    .fab:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0, 0, 0, .3); }
    #back-to-top { opacity: 0; pointer-events: none; transform: translateY(10px); }
    #back-to-top.show { opacity: 1; pointer-events: auto; transform: none; }
    #back-to-top.show:hover { transform: translateY(-3px); }
    :root[data-theme="dark"] #theme-toggle { background: #e8a33d; color: #1a1a1a; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ===== Side Panel for Solutions ===== */
    .solution-panel {
      position: fixed;
      top: 0;
      right: -400px; /* Hidden by default, slide in from right */
      width: 400px; /* Adjust width as needed */
      height: 100%;
      background: var(--bg-alt);
      border-left: 1px solid var(--border);
      box-shadow: -4px 0 10px rgba(0, 0, 0, .1);
      z-index: 1000;
      overflow-y: auto;
      transition: right 0.3s ease-in-out;
      padding: 20px;
    }
    .solution-panel.open {
      right: 0;
    }
    .solution-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .solution-panel-header h2 {
      margin: 0;
      color: var(--text);
    }
    .solution-panel-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--muted);
      transition: color 0.2s ease;
    }
    .solution-panel-close:hover {
      color: var(--accent);
    }
    .solution-panel-content {
      color: var(--text);
    }
    .solution-panel-content a {
      color: var(--accent);
      text-decoration: none;
    }
    .solution-panel-content a:hover {
      text-decoration: underline;
    }
    .solution-panel-content h1, .solution-panel-content h2, .solution-panel-content h3 {
      color: var(--text);
      margin-top: 20px;
      margin-bottom: 10px;
    }
    .solution-panel-content ul {
      padding-left: 20px;
    }
    .solution-panel-content li {
      margin-bottom: 8px;
    }

    .loading-spinner {
      display: inline-block; width: 18px; height: 18px; vertical-align: middle;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .fab-group { right: 12px; bottom: 12px; flex-direction: column-reverse; }
      .fab { width: 42px; height: 42px; font-size: 16px; }
      .markdown-section pre { font-size: .85em; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div id="app"><span class="loading-spinner"></span> Loading...</div>
  <noscript>This site needs JavaScript enabled to display its notes.</noscript>

  <div class="fab-group">
    <button id="back-to-top" class="fab" title="Back to top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>
    <button id="theme-toggle" class="fab" title="Toggle dark mode" aria-label="Toggle dark mode" aria-pressed="false"><i class="fas fa-moon"></i></button>
  </div>

  <div id="solution-panel" class="solution-panel">
    <div class="solution-panel-header">
      <h2>我的题解</h2>
      <button class="solution-panel-close" aria-label="Close solutions panel">&times;</button>
    </div>
    <div class="solution-panel-content">
      <!-- Solutions will be loaded here -->
      <span class="loading-spinner"></span> 正在加载题解...
    </div>
  </div>

  <script>
    window.$docsify = {
      name: 'CP Notes',
      nameLink: '/#/',
      homepage: 'home.md',
      repo: 'https://github.com/TheUserWW/TheUserWW.github.io',
      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 3,
      maxLevel: 4,
      auto2top: true,
      notFoundPage: true,
      externalLinkTarget: '_blank',
      externalLinkRel: 'noopener noreferrer',

      search: {
        paths: 'auto',
        placeholder: 'Search topics, algorithms, or keywords...',
        noData: 'No matching results found. Try different keywords.',
        depth: 4,
        hideOtherSidebarContent: false
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Failed',
        successText: 'Copied!'
      },
      footer: {
        copy: '<span>&copy; 2026 TheUserWW | <a href="https://github.com/TheUserWW" target="_blank" rel="noopener"><i class="fab fa-github"></i> GitHub</a> | <a href="https://codeforces.com/profile/TheUserWW" target="_blank" rel="noopener"><i class="fas fa-code"></i> Codeforces</a></span>',
        auth: '',
        pre: '<hr/>',
        style: 'text-align: center; padding: 20px;'
      }
    };
  </script>

  <!-- Docsify core + plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@1.4.5/dist/docsify-katex.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-footer-enh/dist/docsify-footer-enh.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Prism languages (docsify bundles Prism core; "c" must load before "cpp") -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>

  <script>
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById('theme-toggle');
      var toTop = document.getElementById('back-to-top');

      function render() {
        var dark = root.getAttribute('data-theme') === 'dark';
        toggle.innerHTML = '<i class="fas ' + (dark ? 'fa-sun' : 'fa-moon') + '"></i>';
        toggle.setAttribute('aria-pressed', dark);
      }
      render();

      toggle.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        render();
      });

      // Follow the OS setting until the visitor makes an explicit choice
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (err) {}
        if (!saved) { root.setAttribute('data-theme', e.matches ? 'dark' : 'light'); render(); }
      });

      window.addEventListener('scroll', function () {
        toTop.classList.toggle('show', window.scrollY > 300);
      }, { passive: true });

      toTop.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // "/" or Ctrl/Cmd+/ focuses search (ignored while typing elsewhere)
      document.addEventListener('keydown', function (e) {
        var tag = (e.target.tagName || '').toLowerCase();
        var typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
        if ((e.key === '/' && !typing) || (e.key === '/' && (e.ctrlKey || e.metaKey))) {
          var input = document.querySelector('.sidebar .search input');
          if (input) { e.preventDefault(); input.focus(); }
        }
      });

      // Solutions Panel Logic
      var solutionPanel = document.getElementById('solution-panel');
      var solutionPanelClose = solutionPanel.querySelector('.solution-panel-close');
      var solutionPanelContent = solutionPanel.querySelector('.solution-panel-content');

      // Docsify app name link (CP Notes)
      // We use event delegation because Docsify renders the sidebar asynchronously
      function handleCpNotesClick(event) {
        var target = event.target.closest('.app-name-link, .app-name');
        if (!target) return;

        event.preventDefault(); // Prevent default Docsify navigation
        solutionPanel.classList.add('open');

        // Load solutions content if not already loaded
        if (solutionPanelContent.innerHTML.includes('正在加载题解')) {
          fetch('Solutions/index.md')
            .then(function(response) {
              if (!response.ok) throw new Error('Failed to load solutions');
              return response.text();
            })
            .then(function(markdownContent) {
              // Use marked to render markdown
              if (window.marked) {
                solutionPanelContent.innerHTML = marked.parse(markdownContent);
                
                // Add event listeners to links within the panel to close it when navigating
                var links = solutionPanelContent.querySelectorAll('a');
                links.forEach(function(link) {
                  link.addEventListener('click', function(e) {
                    var href = link.getAttribute('href');
                    // If it's a relative link (to another md file), handle it with Docsify
                    if (href && !href.startsWith('http') && !href.startsWith('#')) {
                      e.preventDefault();
                      // Convert path to Docsify hash route
                      // Ensure we don't have double slashes
                      var targetPath = href.startsWith('/') ? href : '/' + href;
                      window.location.hash = '#' + targetPath;
                      closeSolutionPanel();
                    } else if (href && href.startsWith('#')) {
                      // Anchor link, just close panel
                      closeSolutionPanel();
                    }
                    // For external links, let them open in new tab (as per Docsify config)
                  });
                });
              } else {
                solutionPanelContent.innerHTML = '<div style="white-space: pre-wrap; font-family: inherit;">' + markdownContent + '</div>';
              }
            })
            .catch(function(error) {
              console.error('Error loading solutions:', error);
              solutionPanelContent.innerHTML = '加载题解失败，请检查文件路径。';
            });
        }
      }

      function closeSolutionPanel() {
        solutionPanel.classList.remove('open');
      }

      document.addEventListener('click', handleCpNotesClick);
      solutionPanelClose.addEventListener('click', closeSolutionPanel);

      // Close panel if clicking outside
      document.addEventListener('click', function(event) {
        var isClickInside = solutionPanel.contains(event.target);
        var isClickOnLink = event.target.closest('.app-name-link, .app-name');
        
        if (!isClickInside && !isClickOnLink && solutionPanel.classList.contains('open')) {
          closeSolutionPanel();
        }
      });

      // Close panel with Escape key
      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape' && solutionPanel.classList.contains('open')) {
          closeSolutionPanel();
        }
      });
    })();
  </script>
</body>
</html>
